async function resolveNames(){

function barHTML(list){
  const c = counts(list); const t = c.red+c.amber+c.green;
  if(!t) return list.length ? `<div class="bar empty">${list.length} RECORD${list.length>1?"S":""}</div>` : `<div class="bar empty">NO DATA</div>`;
  const seg = (n,cls) => n ? `<i class="${cls}" style="flex:${n}" title="${n}">${n}</i>` : "";
  return `<div class="bar" role="img" aria-label="${c.red} overdue, ${c.amber} due soon, ${c.green} current">${seg(c.red,"r")}${seg(c.amber,"a")}${seg(c.green,"g")}</div>`;
}

$("#rail").addEventListener("click", e => {

  if(b.dataset.reg) go({view:"register",kind:b.dataset.reg}); else if(b.dataset.rep) go({view:"report",tab:b.dataset.rep}); else go({view:b.dataset.go});
  $("#rail").classList.remove("open");
});

function go(route){

  if(route.view==="register") S.vesselFilter = route.vesselId || "all";

}

  h += `<div class="vtop">
    <div class="kpi"><small>Asset score</small><b class="score" style="color:var(--${scoreTone(sc)||"ink"})">${sc==null?"–":sc.toFixed(1)+"%"}</b><span>share of tracked items current</span></div>
    <button class="kpi" ${S.canWrite?`data-act="hours" data-id="${esc(v.id)}"`:"disabled"}><small>Engine hours${S.canWrite?" · tap to log":""}</small><b>${v.engineHours!=null&&v.engineHours!==""?Number(v.engineHours).toLocaleString()+" hrs":"–"}</b><span>${v.hoursDate?"read "+fmt(v.hoursDate)+(daysUntil(v.hoursDate)!=null?" · "+(-daysUntil(v.hoursDate))+" days ago":""):"no reading yet"}</span></button>
    <button class="kpi" data-act="log" data-id="${esc(v.id)}"><small>Action log</small><b>${recent.length}</b><span>actions · last 7 days</span></button></div>`;

function cellVal(it, col){
  if(col==="lastDone"||col==="date") return `<td class="mono">${fmt(it[col])}</td>`;
  if(col==="rating"||col==="postRating"){ const r = col==="rating" ? riskRating(it.likelihood,it.consequence) : riskRating(it.postLikelihood,it.postConsequence); return `<td>${ratingHTML(r)}</td>`; }
  if(col==="critical") return `<td>${it.critical==="Yes"?`<span class="cell"><b class="r">Critical</b></span>`:""}</td>`;
  if(col==="estCost"||col==="unitPrice") return `<td class="mono">${it[col]!=null&&it[col]!==""?"$"+Number(it[col]).toLocaleString("en-NZ",{minimumFractionDigits:2,maximumFractionDigits:2}):"–"}</td>`;
  if(col==="issueDate"||col==="startDate") return `<td class="mono">${fmt(it[col])}</td>`;
  if(col==="lastBy") return `<td>${esc(it.lastBy || nameOf(it.lastByUser) || "–")}</td>`;
  if(col==="hoursDue"){ if(!it.intervalHours) return `<td class="mono">–</td>`; const l=hoursLeft(it), st=hoursStatus(it);
    if(it.lastHours==null||it.lastHours==="") return `<td class="mono">every ${esc(it.intervalHours)} h<div class="due">log a service</div></td>`;
    return `<td class="mono">${(Number(it.lastHours)+Number(it.intervalHours)).toLocaleString()} h<div class="due ${st}">${l==null?"no hours logged":l<0?`${Math.round(-l)} h over`:`${Math.round(l)} h left`}</div></td>`; }
  if(col==="qty"||col==="minQty") return `<td class="mono">${esc(it[col]??"–")}</td>`;
  if(col==="equipmentId") return `<td>${esc(equipName(it.equipmentId)||"–")}</td>`;
  if(col==="priority"){ const p=it.priority||"–"; const t=p==="Urgent"||p==="Critical"?"r":p==="High"?"a":p==="Shipyard"?"":"g"; return `<td>${t?`<span class="cell"><b class="${t}">${esc(p)}</b></span>`:esc(p)}</td>`; }
  return `<td>${esc(Array.isArray(it[col])?it[col].join(", "):(it[col]||"–"))}</td>`;
}
function viewRegister(){
  const kind = S.route.kind, K = KINDS[kind], sec = sectionOf(kind);
  if(!K) return viewFleet();
  if(K.virtual) return viewMaintHistory(sec);
  if(K.matrix && S.mode!=="list") return viewMatrix(kind, sec);
  if(K.docView && S.mode!=="list") return viewDocument(kind, sec);
  let list = itemsFor(kind);
  if(S.vesselFilter!=="all") list = list.filter(i => S.vesselFilter==="company" ? !i.vesselId : i.vesselId===S.vesselFilter);
  if(S.statusFilter!=="all") list = list.filter(i => status(i)===S.statusFilter);
  if(S.q){ const q=S.q.toLowerCase(); list = list.filter(i => JSON.stringify(i).toLowerCase().includes(q)); }
  const rank = {red:0,amber:1,green:2,info:3,none:4};
  list.sort((a,b)=> rank[status(a)]-rank[status(b)] || String(dueOf(a)||"9").localeCompare(String(dueOf(b)||"9")) || String(a.title).localeCompare(String(b.title)));
  const showVessel = K.scope!=="company" || K.fields.some(f=>f.k==="vesselId");
  const hasDue = !!K.due;
  const vfName = S.vesselFilter!=="all" && S.vesselFilter!=="company" ? vesselName(S.vesselFilter) : "";
  let h = `<div class="head"><div><div class="crumb">${vfName?`<button data-vessel="${esc(S.vesselFilter)}">${esc(vfName)}</button><span>/</span>`:""}<span>${esc(sec.label)}</span></div><h1>${esc(K.label)}</h1></div>
    <div class="actions">${downloads?`<button class="btn" data-act="exportReg">${DL}Export</button>`:""}${S.canWrite?`<button class="btn pri" data-act="add">+ Add ${esc(K.one)}</button>`:""}</div></div>${noticeHTML()}`;
  S._regList = list;
  h += `<div class="tabs" role="tablist">${sec.kinds.map(k=>`<button role="tab" class="${k===kind?"on":""}" data-reg="${k}" ${S.vesselFilter!=="all"&&KINDS[k].scope!=="company"?`data-vid="${esc(S.vesselFilter)}"`:""}>${esc(KINDS[k].label)}</button>`).join("")}</div>`;
  const c = counts(itemsFor(kind).filter(i=>S.vesselFilter==="all"||(S.vesselFilter==="company"?!i.vesselId:i.vesselId===S.vesselFilter)));
  h += `<div class="tools"><input type="search" id="q" placeholder="Search ${esc(K.label.toLowerCase())}" value="${esc(S.q)}" aria-label="Search">`;
  if(showVessel) h += `<select id="vf" aria-label="Filter by asset"><option value="all">All assets</option>${K.scope!=="vessel"?`<option value="company" ${S.vesselFilter==="company"?"selected":""}>Company-wide</option>`:""}${S.vessels.map(v=>`<option value="${esc(v.id)}" ${S.vesselFilter===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select>`;
  if(K.matrix||K.docView) h += `<div class="seg2"><button data-mode="${K.matrix?"matrix":"doc"}">${K.matrix?"Crew matrix":"Document"}</button><button class="on" data-mode="list">List</button></div>`;
  h += `</div>`;
  if(hasDue || ["incident","defect","spare"].includes(kind)){ const tot = c.red+c.amber+c.green; h += `<div class="chips">${[["all","All",tot+c.info+c.none],["red",kind==="incident"?"Serious / open":kind==="spare"?"Below minimum":"Overdue",c.red],["amber",kind==="incident"||kind==="defect"?"Open":kind==="spare"?"At minimum":"Upcoming",c.amber],["green",kind==="incident"?"Completed":"Current",c.green]].map(([v,l,n])=>`<button class="fchip ${S.statusFilter===v?"on":""} ${v}" data-sf="${v}">${esc(l)} <b>${n}</b></button>`).join("")}</div>`; }
  if(!list.length){
    const total = itemsFor(kind).length;
    h += `<div class="panel"><div class="empty-state"><b>${total?"Nothing matches these filters":"No "+esc(K.label.toLowerCase())+" yet"}</b><span>${total?"Clear the search or change the filters.":"Records you add here roll up into each asset’s score on the fleet dashboard."}</span>${!total&&S.canWrite?`<button class="btn pri" data-act="add">+ Add ${esc(K.one)}</button>`:""}</div></div>`;
    return h;
  }
  const cols = K.cols || [];
  let rows = "", lastG = null;
  const grouped = K.group ? list.slice().sort((a,b)=>String(a[K.group]||"~").localeCompare(String(b[K.group]||"~"))) : list;
  grouped.forEach(it => {
    if(K.group){ const g = it[K.group]||"Uncategorised"; if(g!==lastG){ const n = grouped.filter(x=>(x[K.group]||"Uncategorised")===g).length; rows += `<tr class="grp"><td colspan="${cols.length+4+(showVessel?1:0)}">${esc(g)} (${n})</td></tr>`; lastG=g; } }
    const st = status(it), d = dueOf(it), n = daysUntil(d);
    rows += `<tr data-item="${esc(it.id)}"><td style="width:14px"><span class="stripe ${st}"></span></td><td class="title">${esc(it.title)}</td>`;
    if(showVessel) rows += `<td>${esc(vesselName(it.vesselId)||"Company")}</td>`;
    cols.filter(c=>c!==K.group).forEach(col => rows += cellVal(it,col));
    rows += hasDue ? `<td class="mono">${d?fmt(d):"–"}<div class="due ${st}">${d?rel(n):""}</div></td>` : "";
    rows += `<td style="text-align:right;white-space:nowrap">${(it.files||[]).length?`<span class="due" title="${it.files.length} attachment${it.files.length>1?"s":""}">${CLIP}${it.files.length}</span> `:""}${(K.complete||K.renew)&&S.canWrite?`<button class="btn sm" data-act="fill" data-id="${esc(it.id)}">${K.renew?"Renew":K.completeLabel||(stepsOf(it).length||(it.elements||[]).length?"Fill in":"Complete")}</button>`:""}</td></tr>`;
  });
  h += `<div class="panel"><div class="tablewrap"><table><thead><tr><th></th><th>${esc(K.fields.find(f=>f.k==="title").label)}</th>${showVessel?"<th>Asset</th>":""}${cols.filter(c=>c!==K.group).map(c=>`<th>${esc(COLLABEL[c]||c)}</th>`).join("")}${hasDue?"<th>Due</th>":""}<th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  return h;
}

function ratingHTML(r){ const t = r>=15?"r":r>=8?"a":"g"; return r?`<span class="cell"><b class="${t}">${r}</b></span> <span class="due">${r>=15?"High":r>=8?"Medium":"Low"}</span>`:`<span class="due">–</span>`; }

async function saveMode(vid, btn){
  const v = S.vessels.find(x=>x.id===vid); const to = $("#m_to").value, reason = $("#m_reason").value.trim();
  if(!reason){ $("#formerr").innerHTML=`<div class="confirm">Give a reason for the change.</div>`; return; }

function historyEntries(vid){
  const a = S.completions.filter(c=>c.kind==="maintenance" && (!vid||c.vesselId===vid)).map(c=>{ const it=S.items.find(i=>i.id===c.itemId); return {date:c.date, vesselId:c.vesselId, system:it?.system||"", equipment:equipName(it?.equipmentId), task:c.title, type:"Scheduled", by:nameOf(c.by), mins:c.mins, notes:c.notes, comp:c.id}; });
  const b = S.items.filter(i=>i.kind==="defect" && i.state==="Closed" && (!vid||i.vesselId===vid)).map(i=>({date:(i.closedAt||i.updatedAt||"").slice(0,10), vesselId:i.vesselId, system:"", equipment:equipName(i.equipmentId), task:"JOB – "+i.title, type:"Unscheduled / job", by:nameOf(i.lastByUser||i.updatedBy), notes:i.notes, item:i.id}));
  return [...a,...b].sort((x,y)=>String(y.date).localeCompare(String(x.date)));
}
function viewMaintHistory(sec){
  const vf = S.vesselFilter;
  let list = historyEntries(vf!=="all"&&vf!=="company"?vf:null);
  if(S.q){ const q=S.q.toLowerCase(); list=list.filter(e=>JSON.stringify(e).toLowerCase().includes(q)); }
  S._histList = list;
  const vfName = vf!=="all" ? vesselName(vf) : "";
  let h = `<div class="head"><div><div class="crumb">${vfName?`<button data-vessel="${esc(vf)}">${esc(vfName)}</button><span>/</span>`:""}<span>Maintenance</span></div><h1>Maintenance History</h1></div><div class="actions">${downloads?`<button class="btn" data-act="exportHist">${DL}Export</button>`:""}</div></div>${noticeHTML()}`;
  h += `<div class="tabs" role="tablist">${sec.kinds.map(k=>`<button role="tab" class="${k==="maintHistory"?"on":""}" data-reg="${k}" ${vf!=="all"?`data-vid="${esc(vf)}"`:""}>${esc(KINDS[k].label)}</button>`).join("")}</div>`;
  h += `<div class="tools"><input type="search" id="q" placeholder="Search history" value="${esc(S.q)}" aria-label="Search"><select id="vf" aria-label="Filter by asset"><option value="all">All assets</option>${S.vessels.map(v=>`<option value="${esc(v.id)}" ${vf===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select></div>`;
  if(!list.length) return h + `<div class="panel"><div class="empty-state"><b>No maintenance history yet</b><span>Completing a planned maintenance task or closing a job adds an entry here.</span></div></div>`;
  let rows="", lastM=null;
  list.forEach(e=>{ const m = e.date ? parse(e.date).toLocaleDateString("en-NZ",{month:"long",year:"numeric"}).toUpperCase() : "UNDATED";
    if(m!==lastM){ rows+=`<tr class="grp"><td colspan="7">${esc(m)} (${list.filter(x=>(x.date?parse(x.date).toLocaleDateString("en-NZ",{month:"long",year:"numeric"}).toUpperCase():"UNDATED")===m).length})</td></tr>`; lastM=m; }
    rows+=`<tr ${e.comp?`data-comp="${esc(e.comp)}"`:`data-item="${esc(e.item)}"`}><td class="mono">${fmt(e.date)}</td><td>${esc(vesselName(e.vesselId))}</td><td>${esc(e.system||"–")}</td><td>${esc(e.equipment||"–")}</td><td class="title">${esc(e.task)}</td><td>${esc(e.by||"–")}</td><td class="mono">${e.mins?esc(e.mins)+" min":""}</td></tr>`; });
  return h + `<div class="panel"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Asset</th><th>System</th><th>Equipment</th><th>Task</th><th>By</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// ---------- Logbook ----------
function viewLogbook(){
  const lv = S.logVessel;
  const act = S.voyages.filter(v=>v.status==="active");
  let hist = S.voyages.filter(v=>v.status!=="active" && (lv==="all"||v.vesselId===lv)).sort((a,b)=>String(b.departAt).localeCompare(String(a.departAt)));
  if(S.q){ const q=S.q.toLowerCase(); hist=hist.filter(v=>JSON.stringify(v).toLowerCase().includes(q)); }
  S._voyList = hist;
  let h = `<div class="head"><div><div class="crumb">Logbook</div><h1>Voyages</h1></div><div class="actions">${downloads?`<button class="btn" data-act="exportVoyages">${DL}Export</button>`:""}${S.canWrite?`<button class="btn pri" data-act="startVoyage" data-id="${lv!=="all"?esc(lv):""}">Start voyage</button>`:""}</div></div>${noticeHTML()}`;
  h += `<section class="panel"><header><h2>${IC.log}Active voyages</h2><span class="due">${act.length} underway</span></header>` + (act.length ? act.map(v=>`<button class="srow vrow" data-voyage="${esc(v.id)}"><span><b>${esc(vesselName(v.vesselId))}</b><br><span class="due">${esc(v.name||"–")} · from ${esc(v.origin||"–")}</span></span><span class="vmeta"><span class="chip live"><span class="dot"></span>Active ${dur(v.departAt)}</span><span class="due">${(v.crew||[]).length} crew · ${(v.events||[]).length} events</span></span><span class="chev">›</span></button>`).join("") : `<div class="empty-state"><span>No vessels are underway. Start a voyage from here or from an asset page.</span></div>`) + `</section>`;
  h += `<div class="tools"><input type="search" id="q" placeholder="Search voyages" value="${esc(S.q)}" aria-label="Search voyages"><select id="lvf" aria-label="Filter by asset"><option value="all">All assets</option>${S.vessels.map(v=>`<option value="${esc(v.id)}" ${lv===v.id?"selected":""}>${esc(v.name)}</option>`).join("")}</select></div>`;
  if(!hist.length) return h + `<div class="panel"><div class="empty-state"><b>No completed voyages yet</b><span>Completed voyages appear here with their departure, arrival and logbook events.</span></div></div>`;
  let rows="", lastM=null;
  hist.forEach(v=>{ const d=new Date(v.departAt); const m = isNaN(d)?"UNDATED":d.toLocaleDateString("en-NZ",{month:"long",year:"numeric"}).toUpperCase();
    if(m!==lastM){ rows+=`<tr class="grp"><td colspan="6">${esc(m)}</td></tr>`; lastM=m; }
    rows+=`<tr data-voyage="${esc(v.id)}"><td class="title">${esc(v.name||"–")}</td><td>${esc(vesselName(v.vesselId))}</td><td>${esc(v.origin||"–")}<div class="due mono">${fmtDT(v.departAt)}</div></td><td>${esc(v.destination||"–")}<div class="due mono">${fmtDT(v.arriveAt)}</div></td><td class="mono">${dur(v.departAt,v.arriveAt)}</td><td class="mono">${v.endHours!=null&&v.startHours!=null&&v.endHours!==""&&v.startHours!==""?(Number(v.endHours)-Number(v.startHours)).toFixed(1)+" h":"–"}</td></tr>`; });
  return h + `<div class="panel"><div class="tablewrap"><table><thead><tr><th>Voyage / master</th><th>Asset</th><th>Departure</th><th>Arrival</th><th>Duration</th><th>Engine hrs</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function viewVoyage(){
  const v = S.voyages.find(x=>x.id===S.route.voyageId);
  if(!v) return `<div class="crumb"><button data-go2="logbook">← Logbook</button></div><div class="panel"><div class="empty-state"><b>${S.ready?"This voyage no longer exists":"Loading…"}</b></div></div>`;
  const tab = S.route.tab || "events", live = v.status==="active", canW = S.canWrite;
  let h = `<div class="head"><div><div class="crumb"><button data-vessel="${esc(v.vesselId)}">${esc(vesselName(v.vesselId))}</button><span>/</span><button data-go2="logbook">Logbook</button></div>
    <h1>Voyage – ${esc(v.name||"–")}</h1><div class="crumb">${live?`<span class="chip live"><span class="dot"></span>Active ${dur(v.departAt)}</span>`:`<span class="chip green"><span class="dot"></span>Completed · ${dur(v.departAt,v.arriveAt)}</span>`}<span>Departed ${fmtDT(v.departAt)}</span></div></div>
    <div class="actions">${downloads?`<button class="btn" data-act="exportVoyage">${DL}Export</button>`:""}${canW&&live?`<button class="btn pri" data-act="addEvent">+ Add event</button>`:""}</div></div>${noticeHTML()}`;
  h += `<div class="tabs" role="tablist">${[["start","Start up"],["crew",`Crew (${(v.crew||[]).length})`],["events",`Events (${(v.events||[]).length})`],["complete","Complete"]].map(([id,l])=>`<button role="tab" class="${tab===id?"on":""}" data-vtab="${id}">${esc(l)}</button>`).join("")}</div>`;
  const kv = (k,val) => `<div class="kv"><small>${esc(k)}</small><span>${esc(val===""||val==null?"–":val)}</span></div>`;
  if(tab==="start"){
    const w = v.weather||{};
    h += `<section class="panel"><header><h2>Voyage details</h2>${canW?`<button class="btn sm" data-act="editVoyage">Edit start up</button>`:""}</header><div class="kvs">${kv("Voyage name / master",v.name)}${kv("Origin",v.origin)}${kv("Departure",fmtDT(v.departAt))}${kv("Engine hours at start",v.startHours)}${kv("Start fuel (L)",v.startFuel)}</div></section>`;
    h += `<section class="panel"><header><h2>Pre-voyage checks</h2></header>${(v.checks||[]).length?`<div class="steps flat">${v.checks.map(c=>`<div class="step"><span>${esc(c.step)}</span><span class="chip ${c.result==="Fault"?"red":c.result==="OK"?"green":""}"><span class="dot"></span>${esc(c.result)}</span></div>`).join("")}</div>`:`<div class="empty-state"><span>No pre-voyage checks recorded. Add check items under Asset details to prompt for them at start up.</span></div>`}</section>`;
    h += `<section class="panel"><header><h2>Weather and tides</h2></header><div class="kvs">${kv("Wind direction",w.windDir)}${kv("Wind strength (kts)",w.windKts)}${kv("Cloud / rain",w.cloud)}${kv("Wave height (m)",w.wave)}${kv("Tides",v.tides)}${kv("Start up notes",v.startNotes)}</div></section>`;
  } else if(tab==="crew"){
    h += `<section class="panel"><header><h2>${IC.crew}Crew on board</h2>${canW&&live?`<button class="btn sm" data-act="editCrew">Edit crew</button>`:""}</header>${(v.crew||[]).length?`<div class="steps flat">${v.crew.map(c=>`<div class="step"><span><b>${esc(c.name)}</b></span><span class="due">${esc(c.role||"Crew")}</span></div>`).join("")}</div>`:`<div class="empty-state"><span>No crew recorded for this voyage.</span></div>`}</section>`;
  } else if(tab==="complete"){
    if(live) h += `<section class="panel"><div class="empty-state"><b>This voyage is underway · ${dur(v.departAt)}</b><span>Complete it on arrival to record where you finished, engine hours and fuel.</span>${canW?`<button class="btn pri" data-act="completeVoyage">Complete voyage</button>`:""}</div></section>`;
    else h += `<section class="panel"><header><h2>Arrival</h2>${canW?`<button class="btn sm" data-act="completeVoyage">Edit</button>`:""}</header><div class="kvs">${kv("Destination",v.destination)}${kv("Arrived",fmtDT(v.arriveAt))}${kv("Duration",dur(v.departAt,v.arriveAt))}${kv("Engine hours at end",v.endHours)}${kv("End fuel (L)",v.endFuel)}${kv("Fuel used (L)",v.startFuel!=null&&v.endFuel!=null&&v.startFuel!==""&&v.endFuel!==""?(Number(v.startFuel)+Number(v.bunkered||0)-Number(v.endFuel)).toFixed(0):"")}${kv("Completion notes",v.endNotes)}</div>${(v.postChecksDone||[]).length?`<div class="subhead">Post-voyage checks</div><div class="steps flat">${v.postChecksDone.map(c=>`<div class="step"><span>${esc(c.step)}</span><span class="chip ${c.result==="Fault"?"red":c.result==="OK"?"green":""}"><span class="dot"></span>${esc(c.result)}</span></div>`).join("")}</div>`:""}</section>`;
  } else {
    if(canW&&live) h += `<div class="quick">${eventTypesFor(v.vesselId).map(t=>`<button class="qbtn" data-act="addEvent" data-type="${esc(t)}">${esc(t)}</button>`).join("")}</div>`;
    const evs = [{t:v.departAt, type:"System", remarks:`Voyage started by ${v.name||"–"} from ${v.origin||"–"}`}, ...(v.events||[]), ...(live?[]:[{t:v.arriveAt, type:"System", remarks:`Voyage completed at ${v.destination||"–"}`}])].filter(e=>e.t).sort((a,b)=>String(b.t).localeCompare(String(a.t)));
    h += `<div class="panel"><div class="tablewrap"><table><thead><tr><th>Time</th><th>Type</th><th>Remarks</th><th>Logged by</th></tr></thead><tbody>${evs.map(e=>`<tr class="nohover" ${e.id&&canW?`data-event="${esc(e.id)}"`:""}><td class="mono">${fmtDT(e.t)}</td><td><b>${esc(e.type)}</b></td><td>${esc(e.remarks||"")}${e.value?`<div class="due">${esc(e.value)}</div>`:""}</td><td>${esc(e.by?nameOf(e.by):e.type==="System"?"System":"–")}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  return h;
}

function viewReport(){
  const tab = S.route.tab || "overview";
  if(tab!=="overview") return viewReportTab(tab);
  let h = `<div class="head"><div><div class="crumb">Reporting</div><h1>Compliance overview</h1></div><div class="actions">${downloads?`<button class="btn" data-act="exportReport">${DL}Export</button>`:""}</div></div>${noticeHTML()}`;
  const vs = S.vessels.slice().sort((a,b)=>(a.order??99)-(b.order??99));
  const secs = SECTIONS.filter(s=>s.vessel);
  const cell = list => { const c=counts(list); if(!(c.red+c.amber+c.green)) return `<span class="due">–</span>`; return `<span class="cell">${c.red?`<b class="r">${c.red}</b>`:""}${c.amber?`<b class="a">${c.amber}</b>`:""}${c.green?`<b class="g">${c.green}</b>`:""}</span>`; };
  h += `<section class="panel"><header><h2>${IC.report}Status by asset</h2><span class="due">overdue · due ≤ ${WARN_DAYS} d · current</span></header><div class="tablewrap"><table class="matrix"><thead><tr><th>Asset</th><th>Score</th>${secs.map(s=>`<th>${esc(s.label)}</th>`).join("")}</tr></thead><tbody>` +
    vs.map(v => { const its=vesselItems(v.id), sc=scoreOf(its); return `<tr data-vessel="${esc(v.id)}"><td class="title">${esc(v.name)}</td><td class="mono" style="color:var(--${scoreTone(sc)||"muted"})">${sc==null?"–":sc.toFixed(1)+"%"}</td>${secs.map(s=>`<td>${cell(its.filter(i=>s.kinds.includes(i.kind)))}</td>`).join("")}</tr>`; }).join("") +
    `</tbody></table></div></section>`;
  const attn = S.items.filter(i=>["red","amber"].includes(status(i))).sort((a,b)=>(status(a)==="red"?0:1)-(status(b)==="red"?0:1) || String(dueOf(a)||"9").localeCompare(String(dueOf(b)||"9")));
  h += `<section class="panel"><header><h2>Needs attention</h2><span class="due">${attn.length} item${attn.length===1?"":"s"}</span></header>`;
  if(!attn.length) h += `<div class="empty-state"><b>All clear</b><span>Nothing is overdue or due in the next ${WARN_DAYS} days.</span></div>`;
  else h += `<div class="tablewrap"><table><thead><tr><th></th><th>Item</th><th>Register</th><th>Asset</th><th>Due</th></tr></thead><tbody>` + attn.map(it=>{const st=status(it),d=dueOf(it);return `<tr data-item="${esc(it.id)}"><td style="width:14px"><span class="stripe ${st}"></span></td><td class="title">${esc(it.title)}</td><td>${esc(KINDS[it.kind]?.label)}</td><td>${esc(vesselName(it.vesselId)||"Company")}</td><td class="mono">${d?fmt(d):"–"}<div class="due ${st}">${d?rel(daysUntil(d)):esc(it.state||it.severity||"")}</div></td></tr>`;}).join("") + `</tbody></table></div>`;
  return h + `</section>`;
}

function inPeriod(d){ const t = parse(String(d||"").slice(0,10)); return t && (today()-t)/DAY <= S.period && t <= today(); }
function hchart(title, sub, rows, legend){
  const max = Math.max(1, ...rows.map(r=>r.segs.reduce((s,[n])=>s+n,0)));
  S._chartRows.push([title], ["", ...legend.map(l=>l[1])], ...rows.map(r=>[r.label, ...legend.map(l=>(r.segs.find(s=>s[1]===l[0])||[0])[0])]), []);
  const body = rows.length ? rows.map(r=>{ const tot=r.segs.reduce((s,[n])=>s+n,0);
    return `<div class="hrow"><span class="hl" title="${esc(r.label)}">${esc(r.label)}</span><div class="htrack">${tot?`<div class="hfill" style="width:${(tot/max*100).toFixed(1)}%">${r.segs.filter(([n])=>n).map(([n,c])=>`<i class="${c}" style="flex:${n}" title="${n}">${n}</i>`).join("")}</div>`:`<span class="due">0</span>`}</div></div>`; }).join("") : `<div class="empty-state"><span>No data for this period.</span></div>`;
  const ticks = [0, Math.ceil(max/2), max].filter((x,i,a)=>a.indexOf(x)===i);
  return `<section class="panel chart"><header><h2>${esc(title)} <span class="due">${esc(sub)}</span></h2></header><div class="hbody">${body}<div class="hrow axis" ${rows.length?"":"hidden"}><span class="hl"></span><div class="htrack">${ticks.map(t=>`<span style="left:${(t/max*100).toFixed(1)}%">${t}</span>`).join("")}</div></div></div>
    ${legend.length>1?`<div class="legend">${legend.map(([c,n])=>`<span><i class="${c}"></i>${esc(n)}</span>`).join("")}</div>`:""}</section>`;
}
function countChart(title, sub, values){
  const m = {}; values.forEach(v=>{ if(v) m[v]=(m[v]||0)+1; });
  const rows = Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,n])=>({label:k, segs:[[n,"c"]]}));
  return hchart(title, sub, rows, [["c","Count"]]);
}
function viewReportTab(tab){
  S._chartRows = [];
  const label = REPORT_TABS.find(t=>t.id===tab).label;
  const vs = S.vessels.slice().sort((a,b)=>(a.order??99)-(b.order??99));
  const per = `Last ${S.period} days`;
  const live = kinds => vs.map(v=>{ const c=counts(S.items.filter(i=>i.vesselId===v.id&&kinds.includes(i.kind))); return {label:v.name, segs:[[c.red,"r"],[c.amber,"a"]]}; });
  const SA = [["r","Overdue"],["a","Upcoming"]];
  let h = `<div class="head"><div><div class="crumb">Reporting · updated ${new Date().toLocaleTimeString("en-NZ",{hour:"2-digit",minute:"2-digit",hour12:false})}</div><h1>${esc(label)} reports</h1></div><div class="actions">${downloads?`<button class="btn" data-act="exportCharts">${DL}Export</button>`:""}</div></div>${noticeHTML()}`;
  h += `<div class="tabs" role="tablist">${REPORT_TABS.map(t=>`<button role="tab" class="${t.id===tab?"on":""}" data-rep="${t.id}">${esc(t.label)}</button>`).join("")}</div>`;
  h += `<div class="tools"><select id="period" aria-label="Period">${[7,30,90,365].map(d=>`<option value="${d}" ${S.period===d?"selected":""}>Last ${d} days</option>`).join("")}</select></div><div class="charts">`;
  if(tab==="safety"){
    h += hchart("Safety check tasks by asset","live status", live(["safetyCheck"]), SA);
    h += hchart("Completed safety checks and drills", per, vs.map(v=>({label:v.name, segs:[[S.completions.filter(c=>c.vesselId===v.id&&["safetyCheck","drill"].includes(c.kind)&&inPeriod(c.date)).length,"g"]]})), [["g","Completed"]]);
    h += hchart("Safety equipment expiries by asset","live status", live(["equipExpiry"]), SA);
    h += hchart("Failed checklist items by asset", per, vs.map(v=>({label:v.name, segs:[[S.completions.filter(c=>c.vesselId===v.id&&inPeriod(c.date)).reduce((s,c)=>s+(c.results||[]).filter(r=>r.result==="Fail").length,0),"r"]]})), [["r","Failed items"]]);
  } else if(tab==="maint"){
    h += hchart("Planned maintenance by asset","live status", live(["maintenance"]), SA);
    h += hchart("Completed maintenance by asset", per, vs.map(v=>({label:v.name, segs:[[S.completions.filter(c=>c.vesselId===v.id&&c.kind==="maintenance"&&inPeriod(c.date)).length,"g"],[S.items.filter(i=>i.vesselId===v.id&&i.kind==="defect"&&i.state==="Closed"&&inPeriod(i.closedAt||i.updatedAt)).length,"c"]]})), [["g","Scheduled"],["c","Unscheduled / jobs"]]);
    h += hchart("Open jobs by priority","live status", vs.map(v=>{ const o=S.items.filter(i=>i.vesselId===v.id&&i.kind==="defect"&&i.state!=="Closed"); const n=p=>o.filter(i=>i.priority===p||(p==="Urgent"&&i.priority==="Critical")).length; return {label:v.name, segs:[[n("Urgent"),"r"],[n("High"),"a"],[n("Medium"),"c"],[n("Low"),"g"],[n("Shipyard"),"n"]]}; }), [["r","Urgent"],["a","High"],["c","Medium"],["g","Low"],["n","Shipyard"]]);
    h += hchart("Spare parts below minimum","live status", vs.map(v=>{ const c=counts(itemsFor("spare",v.id)); return {label:v.name, segs:[[c.red,"r"],[c.amber,"a"]]}; }), [["r","Below minimum"],["a","At minimum"]]);
  } else if(tab==="hs"){
    const inc = S.items.filter(i=>i.kind==="incident");
    const recent = inc.filter(i=>inPeriod(i.date));
    const st = ["Draft","For review","In review","Completed"];
    h += hchart("Current incidents / events by asset","live status", vs.map(v=>({label:v.name, segs:st.map((s,j)=>[inc.filter(i=>i.vesselId===v.id&&(i.state===s||(s==="Completed"&&i.state==="Closed")||(s==="Draft"&&["Open","Investigating"].includes(i.state)))).length,["n","a","c","g"][j]])})), st.map((s,j)=>[["n","a","c","g"][j],s]));
    h += countChart("Incident / event types", per, recent.map(i=>i.category));
    h += countChart("Contributing factors", per, recent.flatMap(i=>Array.isArray(i.factors)?i.factors:[]));
    h += countChart("Injury types", per, recent.map(i=>i.injuryType));
    h += countChart("Injury locations", per, recent.map(i=>i.injuryLocation));
    h += countChart("Injury outcomes", per, recent.map(i=>i.outcome));
    h += countChart("Personnel involved", per, recent.flatMap(i=>Array.isArray(i.personnel)?i.personnel:[]));
    h += countChart("Notified to authorities", per, recent.map(i=>i.notified||"Not notified"));
    h += hchart("Corrective actions by asset","live status", vs.map(v=>{ const c=counts(S.items.filter(i=>i.kind==="correctiveAction"&&i.vesselId===v.id)); return {label:v.name, segs:[[c.red,"r"],[c.amber,"a"]]}; }), SA);
  } else if(tab==="vdocs"){
    h += hchart("Vessel certificates by asset","live status", live(["vesselCert"]), SA);
    h += hchart("Vessel documents by asset","review status", live(["vesselDoc"]), SA);
    h += hchart("Survey documents by asset","next survey", live(["surveyDoc"]), SA);
    h += hchart("SOPs by asset","review status", live(["sop"]), SA);
  } else if(tab==="crew"){
    const cc = counts(S.items.filter(i=>i.kind==="crewCert"));
    h += hchart("Crew certificates","live status", [{label:"All crew", segs:[[cc.red,"r"],[cc.amber,"a"],[cc.green,"g"]]}], [["r","Overdue"],["a","Upcoming"],["g","Current"]]);

function sigHTML(key, label, val){

function initSigs(){
  document.querySelectorAll("canvas.sig").forEach(cv => {
    if(cv._init) return; cv._init = true;
    const ctx = cv.getContext("2d"); ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#0F2533";
    let drawing = false, any = false;
    const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height]; };
    cv.addEventListener("pointerdown", e => { drawing = true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); });
    cv.addEventListener("pointermove", e => { if(!drawing) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); any = true; });
    const end = () => { if(!drawing) return; drawing = false; if(any && S.editing){ const c = document.createElement("canvas"); c.width = 320; c.height = 90; const x = c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,320,90); x.drawImage(cv,0,0,320,90);
      // signatures are stored on white with dark ink so they print in both themes
      const d = x.getImageData(0,0,320,90); for(let i=0;i<d.data.length;i+=4){ if(d.data[i+3] && (d.data[i]<250||d.data[i+1]<250||d.data[i+2]<250)){ d.data[i]=15;d.data[i+1]=37;d.data[i+2]=51; } } x.putImageData(d,0,0);
      (S.editing.sig ||= {})[cv.dataset.sig] = c.toDataURL("image/png"); } };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  });
}

async function exportPDF(title, blocks){

  const doc = new jsPDF({unit:"mm", format:"a4"}); const W = 180; let y = 20;
  const need = h => { if(y+h > 280){ doc.addPage(); y = 20; } };
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.splitTextToSize(title, W).forEach(l=>{ need(8); doc.text(l, 15, y); y+=8; });
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(110); doc.text(`MarinaOS · exported ${fmtDT(new Date().toISOString())}`, 15, y); y+=8; doc.setTextColor(20);

    if(b.p){ doc.setFontSize(10); String(b.p).split("\n").forEach(par=>{ doc.splitTextToSize(par||" ", W).forEach(l=>{ need(5); doc.text(l,15,y); y+=5; }); }); y+=2; }
    if(b.img){ need(28); try{ doc.addImage(b.img, "PNG", 15, y, 80, 22); }catch(e){} y+=26; }
  }
  try{ await downloads.save({filename:`${title.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").slice(0,80)}.pdf`, data: doc.output("arraybuffer")}); }
  catch(e){ if(e?.code!=="declined") toast("Couldn’t export that PDF."); }

let toastT;
function toast(msg){ clearTimeout(toastT); let t=$(".toast"); if(!t){ t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t);} t.textContent=msg; toastT=setTimeout(()=>t.remove(),2600); }
function writeErr(e){
  if(e && e.code==="invalid_argument"){ S.canWrite=false; render(); return "You don’t have permission to change records here."; }
  if(e && e.code==="quota_exceeded") return "The register is full. Delete old records to make room.";
  return "Couldn’t save. Check your connection and try again.";
}
const stamp = () => ({updatedAt:new Date().toISOString(), ...(myId?{updatedBy:myId}:{})});
async function save(btnEl){
  const ed = S.editing; if(!ed || !db) return;
  const data = readForm(ed.fields);
  const err = $("#formerr");
  const prevIt = ed.id && !ed.vessel ? S.items.find(i=>i.id===ed.id) : null;
  ed.fields.filter(f=>f.type==="signature").forEach(f=>{ if(!data[f.k] && prevIt?.[f.k] && !(ed.cleared||{})[f.k]) data[f.k] = prevIt[f.k]; });
  const isDraft = btnEl?.dataset.draft==="1", isSubmit = btnEl?.dataset.submit==="1";
  if(ed.K?.draftable){ if(isDraft) data.state = "Draft"; else if(isSubmit && (!data.state || data.state==="Draft")) data.state = "For review"; }
  const missing = ed.fields.filter(f=>f.req && f.type!=="heading" && (isDraft ? (f.k==="title" && !data.title) : (Array.isArray(data[f.k]) ? !data[f.k].length : !data[f.k]))).map(f=>f.label);
  if(!ed.vessel && ed.K.scope==="vessel" && !data.vesselId) missing.push("Asset");
  if(missing.length){ err.innerHTML = `<div class="confirm">Fill in: ${esc(missing.join(", "))}.</div>`; return; }
  const btn = btnEl || document.querySelector('[data-act="save"]'); btn.disabled = true;
  try{
    if(ed.vessel){
      const ref = ed.id ? db.collection("vessels").doc(ed.id) : db.collection("vessels").doc();
      const body = {...data, photo: ed.photo || null, ...stamp()};
      if(ed.id) await ref.update(body); else await ref.set(body);
    } else {
      const ref = ed.id ? db.collection("items").doc(ed.id) : db.collection("items").doc();
      const body = {...data, files: ed.files || [], ...stamp()};
      if(ed.kind==="defect"){ const prev = S.items.find(i=>i.id===ed.id); if(data.state==="Closed" && prev?.state!=="Closed"){ body.closedAt = new Date().toISOString(); if(myId) body.lastByUser = myId; } }
      if(ed.id) await ref.update(body); else await ref.set({kind:ed.kind, ...body, createdAt:new Date().toISOString()});
    }
    closeLayer(); toast(isDraft?"Draft saved":isSubmit&&(!prevIt||prevIt.state==="Draft")?"Report submitted for review":ed.id?"Saved":"Added");
  }catch(e){ btn.disabled=false; err.innerHTML = `<div class="confirm">${esc(writeErr(e))}</div>`; }
}

  const t = e.target;
  if(t.closest("[data-close]")){ closeLayer(); S.editing=null; return; }
  const a = t.closest("[data-act]");
  if(a){ e.stopPropagation(); const act=a.dataset.act;
    if(act==="add") openItem(S.route.kind, null, S.vesselFilter);
    else if(act==="addVessel") openVessel(null);
    else if(act==="editVessel") openVessel(S.vessels.find(v=>v.id===a.dataset.id));
    else if(act==="log") openLog(a.dataset.id);
    else if(act==="save") save(a);
    else if(act==="reminders") openReminders();
    else if(act==="mode") openMode(a.dataset.id);
    else if(act==="saveMode") saveMode(a.dataset.id, a);
    else if(act==="newCA"){ const inc = S.items.find(i=>i.id===a.dataset.id); openItem("correctiveAction", null, inc?.vesselId, {source:`Incident: ${inc?.title||""} (${fmt(inc?.date)})`, description:inc?.suggested||""}); }
    else if(act==="viewDoc") openDocView(a.dataset.id);
    else if(act==="pdfDoc"){ const it=S.items.find(i=>i.id===a.dataset.id); if(it) exportPDF(it.title, [{p:`${KINDS[it.kind]?.label||""}${it.version?" · Version "+it.version:""}${it.expiry?" · Review "+fmt(it.expiry):""}`},{p:it.content||""}]); }
    else if(act==="pdfMTOP"){ const secs=itemsFor("motPlan").slice().sort((x,y)=>natSort(x.section,y.section)); exportPDF("Maritime Transport Operator Plan", [{h:"Table of contents",level:2},{p:secs.map(x=>`${x.section||""}  ${x.title}`).join("\n")}, ...secs.flatMap(x=>[{h:`${x.section||""} ${x.title}`},{p:(x.version?`Version ${x.version}. `:"")+(x.reviewDate?`Next review ${fmt(x.reviewDate)}.`:"")},{p:x.content||""}])]); }
    else if(act==="pdfComp"){ const c=S.completions.find(x=>x.id===a.dataset.id); if(c) exportPDF(`${c.title} – ${fmt(c.date)}`, [{p:`Completed ${fmt(c.date)} by ${nameOf(c.by)||"–"}${c.personnel?" · Personnel: "+c.personnel:""}${c.vesselId?" · "+vesselName(c.vesselId):""}`}, ...(c.answers||[]).flatMap(x=> x.t==="check"?[{h:x.label,level:2},{p:(x.value||[]).map(v=>`${v.result==="OK"?"✓":v.result}  ${v.item}`).join("\n")}] : x.t==="signature"?[{h:x.label,level:2},...(x.value?[{img:x.value}]:[{p:"Not signed"}])] : [{h:x.label,level:2},{p:x.t==="tick"?(x.value?"Yes":"No"):String(x.value||"–")}]), ...(c.notes?[{h:"Notes",level:2},{p:c.notes}]:[])]); }
    else if(act==="buildForm") openFormBuilder(a.dataset.id);
    else if(act==="editFormMeta"){ const it=S.items.find(i=>i.id===a.dataset.id); if(it){ const K=KINDS.form; const keep=K.isForm; K.isForm=false; openItem("form", it); K.isForm=keep; S.editing.K=K; } }
    else if(act==="fbAdd"){ fbSync(); S.fb.els.push({t:a.dataset.t, label:"", items:[], req:false}); renderBuilder(S.items.find(i=>i.id===S.fb.id)?.title||""); setTimeout(()=>{ const r=[...document.querySelectorAll('.fbrow [data-fb="label"]')].pop(); r&&r.focus(); },0); }
    else if(act==="fbDel"){ fbSync(); S.fb.els.splice(Number(a.dataset.i),1); renderBuilder(S.items.find(i=>i.id===S.fb.id)?.title||""); }
    else if(act==="fbUp"||act==="fbDown"){ fbSync(); const i=Number(a.dataset.i), j=act==="fbUp"?i-1:i+1; [S.fb.els[i],S.fb.els[j]]=[S.fb.els[j],S.fb.els[i]]; renderBuilder(S.items.find(x=>x.id===S.fb.id)?.title||""); }
    else if(act==="fbSave") fbSave(a);
    else if(act==="clearSig"){ const cv=document.querySelector(`canvas[data-sig="${CSS.escape(a.dataset.key)}"]`); if(cv){ cv.getContext("2d").clearRect(0,0,cv.width,cv.height); } if(S.editing?.sig) delete S.editing.sig[a.dataset.key]; }
    else if(act==="resign"){ const w=document.querySelector(`[data-sigwrap="${CSS.escape(a.dataset.key)}"]`); if(w){ w.innerHTML=`<canvas class="sig" data-sig="${esc(a.dataset.key)}" width="640" height="180" aria-label="Signature pad"></canvas><button type="button" class="btn sm" data-act="clearSig" data-key="${esc(a.dataset.key)}">Clear</button>`; (S.editing.cleared ||= {})[a.dataset.key]=true; if(S.editing.prevSig) delete S.editing.prevSig[a.dataset.key]; initSigs(); } }
    else if(act==="matrixComplete") openMatrixComplete();
    else if(act==="mcNext"){ const id=$("#mc_task").value; if(id) openFill(id); }
    else if(act==="startVoyage") openVoyageStart(a.dataset.id||"");
    else if(act==="saveVoyage") saveVoyage(a);
    else if(act==="editVoyage") openVoyageStart(null, S.voyages.find(v=>v.id===S.route.voyageId));
    else if(act==="addEvent") openEvent(a.dataset.type);
    else if(act==="saveEvent") saveEvent(a);
    else if(act==="askDelEvent") $("#formerr").innerHTML = `<div class="confirm"><span>Delete this event?</span><button class="btn sm danger" data-act="delEvent">Delete</button><button class="btn sm" data-act="noDel">Keep</button></div>`;
    else if(act==="delEvent") saveEvent(a, true);
    else if(act==="completeVoyage") openComplete();
    else if(act==="saveComplete") saveComplete(a);
    else if(act==="editCrew") openCrewEdit();
    else if(act==="saveCrew") saveCrew(a);
    else if(act==="openVoyage"){ closeLayer(); go({view:"voyage",voyageId:a.dataset.id,tab:"events"}); }
    else if(act==="exportReg") exportRegister();
    else if(act==="exportHist") saveCSV("Maintenance history", [["Date","Asset","System","Equipment","Task","Type","By","Actual time (min)","Notes"], ...(S._histList||[]).map(e=>[e.date,vesselName(e.vesselId),e.system,e.equipment,e.task,e.type,e.by,e.mins??"",e.notes||""])]);
    else if(act==="exportVoyages") saveCSV("Voyage history", [["Voyage / master","Asset","Origin","Departure","Destination","Arrival","Duration","Engine hrs start","Engine hrs end","Start fuel","End fuel","Crew","Events"], ...(S._voyList||[]).map(v=>[v.name,vesselName(v.vesselId),v.origin,fmtDT(v.departAt),v.destination||"",fmtDT(v.arriveAt),dur(v.departAt,v.arriveAt),v.startHours??"",v.endHours??"",v.startFuel??"",v.endFuel??"",(v.crew||[]).map(c=>c.name),(v.events||[]).length])]);
    else if(act==="exportVoyage") exportVoyage();
    else if(act==="exportCharts") saveCSV(`${REPORT_TABS.find(t=>t.id===S.route.tab)?.label||""} report last ${S.period} days`, S._chartRows||[]);
    else if(act==="exportReport"){ const secs=SECTIONS.filter(s=>s.vessel); saveCSV("Compliance overview", [["Asset","Score %",...secs.flatMap(s=>[s.label+" overdue",s.label+" due soon",s.label+" current"])], ...S.vessels.map(v=>{const its=vesselItems(v.id),sc=scoreOf(its); return [v.name, sc==null?"":sc.toFixed(1), ...secs.flatMap(s=>{const c=counts(its.filter(i=>s.kinds.includes(i.kind))); return [c.red,c.amber,c.green];})];}), [], ["Needs attention"], ["Status","Item","Register","Asset","Due"], ...S.items.filter(i=>["red","amber"].includes(status(i))).map(i=>[status(i)==="red"?"Overdue":"Due soon", i.title, KINDS[i.kind]?.label, vesselName(i.vesselId)||"Company", dueOf(i)||""])]); }
    else if(act==="fill") openFill(a.dataset.id, null, a.dataset.crew);
    else if(act==="submitFill") submitFill(a);
    else if(act==="viewComp") openCompletion(a.dataset.id);
    else if(act==="backItem"){ const it=S.items.find(i=>i.id===a.dataset.id); if(it) openItem(it.kind,it); }
    else if(act==="hours") openHours(a.dataset.id);
    else if(act==="saveHours") saveHours(a.dataset.id, a);
    else if(act==="rmFile" && S.editing){ S.editing.files.splice(Number(a.dataset.i),1); if(S.editing.vessel) S.editing.photo=null; renderFiles(); }
    else if(act==="askDel"){ $("#formerr").innerHTML = `<div class="confirm"><span>Delete this ${S.editing?.vessel?"asset":"record"} permanently?</span><button class="btn sm danger" data-act="del">Delete</button><button class="btn sm" data-act="noDel">Keep</button></div>`; }
    else if(act==="del") del();
    else if(act==="noDel") $("#formerr").innerHTML="";
    return; }
  if(t.closest("#rail")) return;
  const r = t.closest("[data-reg]"); if(r){ go({view:"register",kind:r.dataset.reg,vesselId:r.dataset.vid}); return; }
  const v = t.closest("[data-vessel]"); if(v){ go({view:"vessel",vesselId:v.dataset.vessel}); return; }
  const g = t.closest("[data-go2]"); if(g){ if(g.dataset.lv) S.logVessel = g.dataset.lv; go({view:g.dataset.go2}); return; }
  const vy = t.closest("[data-voyage]"); if(vy){ go({view:"voyage",voyageId:vy.dataset.voyage,tab:"events"}); return; }
  const md = t.closest("[data-mode]"); if(md){ S.mode = md.dataset.mode; render(); return; }
  const sfc = t.closest("[data-sf]"); if(sfc){ S.statusFilter = sfc.dataset.sf; render(); return; }
  const io = t.closest("[data-item-open]"); if(io){ const it=S.items.find(i=>i.id===io.dataset.itemOpen); if(it){ const K=KINDS[it.kind]; openItem(it.kind,it); } return; }
  const tc = t.closest("[data-toc]"); if(tc){ e.preventDefault(); document.getElementById("sec-"+tc.dataset.toc)?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const vt = t.closest("[data-vtab]"); if(vt){ S.route = {...S.route, tab:vt.dataset.vtab}; render(); return; }
  const rp = t.closest("[data-rep]"); if(rp){ go({view:"report",tab:rp.dataset.rep}); return; }
  const cr = t.closest("tr[data-comp]"); if(cr){ openCompletion(cr.dataset.comp); return; }
  const er = t.closest("tr[data-event]"); if(er){ openEvent(null, er.dataset.event); return; }
  const row = t.closest("tr[data-item]"); if(row){ const it=S.items.find(i=>i.id===row.dataset.item); if(it) openItem(it.kind, it); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#layer").innerHTML){ closeLayer(); S.editing=null; } });
document.addEventListener("submit", e => { e.preventDefault(); save(); });
document.addEventListener("input", e => { if(e.target.id==="q"){ S.q=e.target.value; S._focusQ=true; render(); S._focusQ=false; } });
document.addEventListener("change", async e => {
  const id = e.target.id;
  if(e.target.dataset.hide){ const v=e.target.dataset.hide; S.hidden = e.target.checked ? S.hidden.filter(x=>x!==v) : [...S.hidden, v]; try{ localStorage.setItem("marinaos.hidden", JSON.stringify(S.hidden)); }catch(err){} render(); setTimeout(()=>{ const d=document.querySelector("details.picker"); if(d) d.open=true; },0); return; }
  if(e.target.dataset.fb==="t" && S.fb){ fbSync(); const i=Number(e.target.closest(".fbrow").dataset.i); S.fb.els[i].t=e.target.value; renderBuilder(S.items.find(x=>x.id===S.fb.id)?.title||""); return; }
  if(id==="fileIn"){ const fl=[...e.target.files]; e.target.value=""; uploadFiles(fl); return; }
  if(id==="e_type"){ const vl = EVENT_VALUE[e.target.value]; const w=$("#e_valwrap"); w.hidden=!vl; if(vl){ $("#e_vallab").textContent=vl; const inp=$("#e_val"); const n = ["Engineering log","Bunkering"].includes(e.target.value); inp.type = n?"number":"text"; if(n){inp.setAttribute("inputmode","decimal");inp.step="any";} else inp.removeAttribute("inputmode"); } return; }
  if(id==="y_vessel"){ const keep = S.editing; openVoyageStart(e.target.value); return; }
  if(id==="lvf"){ S.logVessel=e.target.value; render(); return; }
  if(id==="period"){ S.period=Number(e.target.value); render(); return; }
  if(id==="vf"){ S.vesselFilter=e.target.value; render(); }
  else if(id==="sf"){ S.statusFilter=e.target.value; render(); }
  else if(id==="vstatus" && db){ try{ await db.collection("vessels").doc(S.route.vesselId).update({status:e.target.value, ...stamp()}); toast("Status updated"); }catch(err){ toast(writeErr(err)); } }
});

// ---------- Boot ----------
try{ const r = JSON.parse(localStorage.getItem("marinaos.route")||"null"); if(r && r.view) S.route = r; }catch(e){}
const h = (location.hash||"").slice(1); if(KINDS[h]) S.route = {view:"register",kind:h}; else if(h==="report") S.route={view:"report"};
render();

(async () => {
  if(!window.claude || !window.claude.use){ S.dbOk=false; S.ready=true; render(); return; }
  const [d,u,as,dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets"), claude.use("downloads")]);
  db = d; user = u; assets = as; downloads = dl;
  if(user){
    try{ myId = await user.id(); }catch(e){}
    try{ const me = await user.me(); S.me = (me.name||"").split(" ")[0] || null; }catch(e){}
    try{ const w = await user.can("data.write"); if(w===false) S.canWrite=false; }catch(e){}
  }
  if(!db){ S.dbOk=false; S.canWrite=false; S.ready=true; render(); return; }
  S.dbOk = true;
  let got = 0; const done = () => { if(++got>=2) S.ready=true; };
  const onErr = e => { if(e && e.code==="revoked"){ S.dbOk=false; S.canWrite=false; render(); } };
  db.collection("vessels").onSnapshot(snap => { S.vessels = snap.docs.map(x=>({id:x.id, ...x.data()})); if(!S._v){S._v=1;done();} render(); }, onErr);
  db.collection("items").onSnapshot(snap => { S.items = snap.docs.map(x=>({id:x.id, ...x.data()})).filter(i=>KINDS[i.kind]); if(!S._i){S._i=1;done();} render(); resolveNames(); }, onErr);
  db.collection("voyages").onSnapshot(snap => { S.voyages = snap.docs.map(x=>({id:x.id, ...x.data()})); render(); }, onErr);
  setInterval(() => { if(S.voyages.some(v=>v.status==="active") && !$("#layer").innerHTML && document.activeElement?.id!=="q") render(); }, 60000);
  db.collection("completions").onSnapshot(snap => { S.completions = snap.docs.map(x=>({id:x.id, ...x.data()})); render(); resolveNames(); }, onErr);
})();
})();
</script>
